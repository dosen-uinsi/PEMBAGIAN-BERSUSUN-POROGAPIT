<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Porogapit - By Mathnology</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
  :root {
    --primary: #1976d2;
    --success: #388e3c;
    --error: #d32f2f;
    --bg-color: #f0f2f5;
    --board-bg: #fcdced;
    --comic-border: 3px solid #000;
  }

  /* Global Reset & Font Komik */
  *, *::before, *::after {
    box-sizing: border-box;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px 15px;
    background-color: #ffeb3b; 
    background-image: radial-gradient(#fbc02d 15%, transparent 16%), radial-gradient(#fbc02d 15%, transparent 16%);
    background-size: 30px 30px;
    background-position: 0 0, 15px 15px; 
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
    overflow-x: hidden;
  }

  /* --- HEADER & JUDUL 3D KOMIK --- */
  .header-info { 
    width: 100%; 
    max-width: 950px;
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
  }

  .header-panel {
    background-color: #fff;
    border: 5px solid #000;
    border-radius: 20px;
    padding: 20px 30px;
    box-shadow: 10px 10px 0px rgba(0,0,0,0.9);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
  }

  .comic-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #000; 
    box-shadow: 6px 6px 0px #000; 
    background-color: #fff;
    transform: rotate(-5deg); 
    flex-shrink: 0;
  }
  
  .title-text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .comic-title { 
    margin: 0; 
    display: flex;
    flex-direction: column;
    text-transform: uppercase;
    transform: skew(-4deg) rotate(-2deg); 
    line-height: 0.95;
    position: relative;
  }

  /* Efek 3D Baris Pertama */
  .line1 {
    font-size: 26px;
    color: #fff; 
    font-weight: 900;
    letter-spacing: 2px;
    -webkit-text-stroke: 2px #000;
    text-shadow: 1px 1px 0 #000, 2px 2px 0 #000, 3px 3px 0 #000, 4px 4px 0 #2196f3, 5px 5px 0 #2196f3;
    margin-left: 10px;
    z-index: 2;
  }

  /* Efek 3D Super Tebal Baris Kedua */
  .line2 {
    font-size: 64px;
    color: #ffeb3b; 
    font-weight: 900;
    letter-spacing: 3px;
    -webkit-text-stroke: 3px #000;
    text-shadow: 
      1px 1px 0 #f57c00, 2px 2px 0 #f57c00, 3px 3px 0 #f57c00, 4px 4px 0 #f57c00, 
      5px 5px 0 #d32f2f, 6px 6px 0 #d32f2f, 7px 7px 0 #d32f2f, 8px 8px 0 #d32f2f, 
      9px 9px 0 #000, 10px 10px 0 #000, 11px 11px 0 #000, 12px 12px 0 #000;
    z-index: 1;
  }
  
  /* Lencana "By Mathnology" */
  .subtitle {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    margin-left: auto; 
    margin-top: 20px; 
    transform: rotate(-3deg); 
    display: inline-block;
    padding: 6px 20px;
    background: #00bcd4; 
    border: 3px solid #000;
    border-radius: 20px;
    box-shadow: 4px 4px 0px #000;
    position: relative;
    z-index: 3;
  }

  /* --- MAIN LAYOUT RESPONSIVE --- */
  .main-layout {
    display: flex; 
    gap: 30px; 
    justify-content: center; 
    align-items: flex-start;
    z-index: 10;
    width: 100%;
    max-width: 950px;
  }

  .board-wrapper {
    display: flex;
    justify-content: center;
    width: auto;
  }

  /* --- PAPAN POROGAPIT --- */
  .container {
    position: relative; 
    width: 550px; /* Ukuran asli dipertahankan agar JS tidak hancur */
    min-height: 580px;
    background-color: var(--board-bg); 
    border: 5px solid #000; 
    border-radius: 15px; 
    box-shadow: 10px 10px 0px rgba(0,0,0,0.85); 
    padding-bottom: 50px;
    transform-origin: top center;
  }

  /* --- MEDIA QUERIES (OPTIMASI HP) --- */
  @media (max-width: 950px) {
    /* Layout berubah jadi vertikal (tumpuk atas bawah) */
    .main-layout { flex-direction: column; align-items: center; gap: 15px; }
    .side-panel { width: 100%; max-width: 550px; }
  }

  @media (max-width: 768px) {
    /* Header beradaptasi di layar kecil */
    .header-panel { flex-direction: column; text-align: center; gap: 15px; }
    .title-text { align-items: center; }
    .comic-title { transform: none; }
    .line1 { font-size: 20px; margin-left: 0; }
    .line2 { font-size: 46px; -webkit-text-stroke: 2px #000; text-shadow: 1px 1px 0 #f57c00, 2px 2px 0 #f57c00, 3px 3px 0 #d32f2f, 4px 4px 0 #d32f2f, 5px 5px 0 #000, 6px 6px 0 #000, 7px 7px 0 #000; }
    .subtitle { margin-left: 0; margin-top: 15px; transform: none; font-size: 16px; }
    .comic-avatar { width: 90px; height: 90px; border-width: 3px; }
  }

  @media (max-width: 600px) {
    /* Papan mengecil, tap border ditarik ke atas agar tidak renggang */
    .container { transform: scale(0.85); margin-bottom: -90px; }
  }

  @media (max-width: 480px) {
    /* Papan lebih kecil lagi untuk HP sempit */
    .container { transform: scale(0.65); margin-bottom: -200px; }
    .line2 { font-size: 36px; }
    .side-panel { padding: 15px; }
    .numpad button { font-size: 20px; padding: 12px; }
  }

  @media (max-width: 380px) {
    .container { transform: scale(0.55); margin-bottom: -260px; }
    .line2 { font-size: 30px; }
  }

  /* --- KOTAK ANGKA --- */
  .box {
    position: absolute; width: 52px; height: 52px;
    background-color: white; border: var(--comic-border); box-shadow: 3px 3px 0px #000; 
    text-align: center; font-size: 26px; font-weight: bold; font-family: inherit;
    outline: none; transition: 0.1s; cursor: pointer; border-radius: 8px;
    touch-action: manipulation;
  }
  .box.active-input {
    border-color: var(--primary); background-color: #e3f2fd;
    transform: scale(1.15) translateY(-2px); z-index: 10; box-shadow: 4px 4px 0px var(--primary); 
  }
  .box.correct { background-color: #c8e6c9 !important; border-color: var(--success) !important; color: #1b5e20; box-shadow: 3px 3px 0px var(--success); }
  .box.wrong { background-color: #ffcdd2 !important; border-color: var(--error) !important; color: #b71c1c; box-shadow: 3px 3px 0px var(--error); }
  .box[readonly]:not(.active-input) { background-color: #f5f5f5; cursor: default; }

  .dividend-box { cursor: pointer; transition: background-color 0.1s, transform 0.1s; }
  .dividend-box:hover { transform: scale(1.05); }
  .dividend-box.selected { background-color: #fff9c4 !important; border-color: #ff9800 !important; box-shadow: 4px 4px 0px #ff9800; transform: translateY(-2px); }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-5deg); } 75% { transform: translateX(6px) rotate(5deg); } }
  .shake { animation: shake 0.4s ease-in-out; }

  .hidden-step { opacity: 0; pointer-events: none; transform: translateY(-10px); }
  .fade-in { opacity: 1; pointer-events: auto; transform: translateY(0); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); } 
  
  .div-line-h { position: absolute; height: 8px; background: #000; border-radius: 4px; }
  .div-line-v { position: absolute; width: 8px; background: #000; border-radius: 4px; }
  .h-line { position: absolute; height: 6px; background: #000; border-radius: 3px; }
  .minus-sign { position: absolute; font-size: 40px; font-weight: 900; color: #000; }
  .arrow-svg { position: absolute; width: 24px; } 

  /* --- PANEL SAMPING --- */
  .side-panel {
    display: flex; flex-direction: column; gap: 15px;
    background: white; padding: 25px; border-radius: 15px;
    border: 4px solid #000; box-shadow: 8px 8px 0px rgba(0,0,0,0.85);
    width: 350px; 
  }

  .mode-box {
    background: #f8f9fa; border: var(--comic-border); box-shadow: 4px 4px 0px #000;
    padding: 15px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px;
  }
  .mode-box label { font-size: 14px; font-weight: 900; color: #000; text-transform: uppercase; }
  
  .custom-select, .input-row input {
    width: 100%; padding: 12px; border-radius: 8px; border: var(--comic-border);
    font-family: inherit; font-weight: bold; font-size: 16px; background: white; cursor: pointer;
    box-shadow: 2px 2px 0px #000; touch-action: manipulation;
  }

  .input-row { display: flex; gap: 8px; align-items: center; }

  /* --- TOMBOL KOMIK --- */
  button {
    padding: 15px; /* Dibuat lebih tebal agar nyaman disentuh */
    border: var(--comic-border); border-radius: 8px; font-weight: 900;
    cursor: pointer; transition: 0.1s; font-size: 14px; font-family: inherit;
    text-transform: uppercase; box-shadow: 4px 4px 0px #000; touch-action: manipulation;
  }
  .btn-primary { background: #29b6f6; color: #000; }
  .btn-success { background: #66bb6a; color: #000; }
  .btn-orange { background: #ffa726; color: #000; margin-top: 5px; font-size: 16px; border-width: 4px; box-shadow: 5px 5px 0px #000; }
  .btn-purple { background: #ab47bc; color: #fff; margin-top: 10px; }
  
  button:hover { transform: translateY(-2px) translateX(-2px); box-shadow: 6px 6px 0px #000; }
  button:active { transform: translateY(4px) translateX(4px); box-shadow: 0px 0px 0px #000; }

  /* --- NUMPAD --- */
  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 5px 0; }
  .numpad button { background: #fff; color: #000; font-size: 24px; padding: 15px; }
  .numpad .btn-del { grid-column: span 2; background: #ef5350; color: #fff; font-size: 18px; }

  /* --- KOTAK PESAN --- */
  #msg {
    margin-top: 20px; padding: 15px 20px; border-radius: 15px; 
    background: white; border: 4px solid #000; box-shadow: 6px 6px 0px #000;
    font-weight: 900; text-align: center; width: 100%; max-width: 550px;
    min-height: 50px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; position: relative;
  }
  #msg::before {
    content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    border-width: 0 15px 15px 15px; border-style: solid; border-color: transparent transparent #000 transparent;
  }
  #msg::after {
    content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
    border-width: 0 10px 10px 10px; border-style: solid; border-color: transparent transparent #fff transparent;
  }
</style>
</head>
<body>

<div class="header-info">
  <div class="header-panel">
    <img src="https://raw.githubusercontent.com/dosen-uinsi/PEMBAGIAN-BERSUSUN-POROGAPIT/refs/heads/main/Pembagian.gif" alt="Maskot Porogapit" class="comic-avatar">
    
    <div class="title-text">
      <h2 class="comic-title">
        <span class="line1">PEMBAGIAN BERSUSUN</span>
        <span class="line2">POROGAPIT</span>
      </h2>
      <div class="subtitle">By Mathnology</div>
    </div>
  </div>
</div>

<div class="main-layout">
  <div class="board-wrapper">
    <div class="container" id="app-container"></div>
  </div>

  <div class="side-panel">
    <div class="mode-box">
      <label>MODE OTOMATIS (3 DIGIT)</label>
      <select id="difficulty-level" class="custom-select">
        <option value="1">Level 1: Tanpa Sisa</option>
        <option value="2">Level 2: Dengan Sisa</option>
        <option value="3">Level 3: Ada Nol di Tengah</option>
      </select>
      <button class="btn-primary" onclick="startAuto()">Buat Soal Acak</button>
    </div>

    <div class="mode-box">
      <label>MODE MANUAL (3 DIGIT)</label>
      <div class="input-row">
        <input type="number" id="manual-dividend" placeholder="Cth: 144">
        <span style="font-weight:900; font-size: 24px;">÷</span>
        <input type="number" id="manual-divisor" placeholder="1 Digit">
      </div>
      <button class="btn-success" onclick="startManual()">Gunakan Soal Ini</button>
    </div>

    <div class="numpad">
      <button onclick="pressNum(1)">1</button><button onclick="pressNum(2)">2</button><button onclick="pressNum(3)">3</button>
      <button onclick="pressNum(4)">4</button><button onclick="pressNum(5)">5</button><button onclick="pressNum(6)">6</button>
      <button onclick="pressNum(7)">7</button><button onclick="pressNum(8)">8</button><button onclick="pressNum(9)">9</button>
      <button onclick="pressNum(0)">0</button><button class="btn-del" onclick="pressDel()">Hapus ⌫</button>
    </div>

    <button class="btn-purple" onclick="getHint()">💡 Minta Petunjuk!</button>
    <button class="btn-orange" onclick="checkStep()">Periksa Jawaban! ✔️</button>
  </div>
</div>

<div id="msg">Selamat datang! Ayo mulai belajar pembagian.</div>

<script>
  // Script game tetap sama, tidak ada yang dirusak
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    if (type === 'correct') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.1); } 
    else if (type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
    else if (type === 'win') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5); gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
  }

  function triggerConfetti() {
    const duration = 4000; const end = Date.now() + duration;
    (function frame() {
        confetti({ particleCount: 8, startVelocity: 0, ticks: 250, origin: { x: Math.random(), y: Math.random() * -0.2 }, colors: ['#1976d2', '#388e3c', '#d32f2f', '#ef6c00', '#8e24aa', '#fcdced'], shapes: ['square', 'circle'], gravity: 0.8, scalar: 1.2, zIndex: 1000 });
        if (Date.now() < end) requestAnimationFrame(frame);
    }());
  }

  let correctKeys = {}, stepMap = [], mathSteps = [], currentStep = 0, activeId = null;
  let currentDivisor = 0, currentDividend = 0;
  
  let isSelectionPhase = false;
  let initialDigitIndex = 0;
  let userSelectedDigitIndex = -1; 

  function setActive(id) {
    if(isSelectionPhase) return; 
    if(!stepMap[currentStep] || !stepMap[currentStep].in.includes(id)) return;
    document.querySelectorAll('.box').forEach(b => b.classList.remove('active-input'));
    activeId = id; document.getElementById(id).classList.add('active-input');
  }

  function attachEvents() {
    document.querySelectorAll('.user-input').forEach(el => el.addEventListener('click', () => setActive(el.id)));
  }

  function pressNum(n) {
    if(isSelectionPhase || !activeId) return;
    document.getElementById(activeId).value = n;
    let inputs = stepMap[currentStep].in;
    let idx = inputs.indexOf(activeId);
    if(idx !== -1 && idx < inputs.length - 1) setActive(inputs[idx+1]);
  }

  function pressDel() { if(activeId && !isSelectionPhase) document.getElementById(activeId).value = ''; }

  function selectDividend(idx) {
    if (!isSelectionPhase) return;
    if (idx > 1) { playSound('wrong'); updateMsg("Pilih 1 digit atau 2 digit awal saja!", "var(--error)"); return; }

    if (userSelectedDigitIndex === idx) {
        userSelectedDigitIndex = -1;
        document.querySelectorAll('.dividend-box').forEach(el => el.classList.remove('selected'));
        updateMsg("Pilihan dibatalkan. Silakan pilih kembali.", "#000");
        return;
    }

    userSelectedDigitIndex = idx;
    document.querySelectorAll('.dividend-box').forEach(el => el.classList.remove('selected'));
    for(let i = 0; i <= idx; i++) { document.getElementById(`div_digit_${i}`).classList.add('selected'); }
    updateMsg("Pilihan disimpan! Klik tombol 'Periksa Jawaban! ✔️'", "#1976d2");
  }

  function setupEngine(divisor, dividend) {
    currentDivisor = divisor;
    currentDividend = dividend;
    let strDiv = dividend.toString();
    mathSteps = []; let currentVal = 0; let hasStarted = false;

    for (let i = 0; i < strDiv.length; i++) {
        let digit = parseInt(strDiv[i]);
        currentVal = currentVal * 10 + digit;
        if (currentVal >= divisor || hasStarted || i === strDiv.length - 1) {
            let qDigit = Math.floor(currentVal / divisor);
            let sub = qDigit * divisor; let rem = currentVal - sub;
            mathSteps.push({ currentVal, qDigit, sub, rem, bringDown: (i < strDiv.length - 1) ? parseInt(strDiv[i+1]) : null, digitIndex: i });
            hasStarted = true; currentVal = rem;
        }
    }

    let html = ''; correctKeys = {}; stepMap = [];
    html += `<input type="text" class="box" style="left: 100px; top: 140px;" readonly value="${divisor}">`;
    html += `<div class="div-line-v" style="left: 170px; top: 120px; height: 80px;"></div>`;
    html += `<div class="div-line-h" style="left: 170px; top: 120px; width: 250px;"></div>`;

    for(let i=0; i<3; i++) { html += `<input type="text" id="div_digit_${i}" class="box dividend-box" style="left: ${200 + i*70}px; top: 140px;" readonly value="${strDiv[i]}" onclick="selectDividend(${i})">`; }

    for (let k = 0; k < mathSteps.length; k++) {
        let s = mathSteps[k], qId = `q_${k}`; let qClass = "box user-input hidden-step"; 
        html += `<input type="text" id="${qId}" class="${qClass}" style="left: ${200 + s.digitIndex*70}px; top: 50px;" readonly>`;
        correctKeys[qId] = s.qDigit.toString();

        let valLen = s.currentVal.toString().length;
        let subStr = s.sub.toString().padStart(valLen, '0'), subIds = [];
        for(let j=0; j<subStr.length; j++) {
            let subId = `sub_${k}_${j}`; subIds.push(subId);
            html += `<input type="text" id="${subId}" class="box user-input hidden-step" style="left: ${200 + (s.digitIndex - (subStr.length - 1 - j))*70}px; top: ${210 + k*170}px;" readonly>`;
            correctKeys[subId] = subStr[j];
        }

        let fixedLineL = 190; let fixedLineW = 215; let fixedMinusLeft = 415; 
        html += `<div id="line_${k}" class="h-line hidden-step" style="left: ${fixedLineL}px; top: ${285 + k*170}px; width: ${fixedLineW}px;"></div>`;
        html += `<div id="minus_${k}" class="minus-sign hidden-step" style="left: ${fixedMinusLeft}px; top: ${255 + k*170}px;">-</div>`;

        stepMap.push({ in: [qId], out: [`line_${k}`, `minus_${k}`, ...subIds], type: 'q', mStep: k });

        if (k < mathSteps.length - 1) {
            let bringValStr = s.rem.toString() + s.bringDown.toString(), bringIds = [];
            for(let j=0; j<bringValStr.length; j++) {
                let bId = `bring_${k}_${j}`; bringIds.push(bId);
                html += `<input type="text" id="${bId}" class="box user-input hidden-step" style="left: ${200 + ((s.digitIndex + 1) - (bringValStr.length - 1 - j))*70}px; top: ${310 + k*170}px;" readonly>`;
                correctKeys[bId] = bringValStr[j];
            }
            
            let arrowTop = 204; let arrowBottom = 310 + k * 170 - 8; let arrowH = arrowBottom - arrowTop;
            let pathD = `M9,0 L15,0 L15,${arrowH - 14} L22,${arrowH - 14} L12,${arrowH} L2,${arrowH - 14} L9,${arrowH - 14} Z`;
            let arrowLeft = 200 + (s.digitIndex + 1) * 70 + 17;

            html += `<svg id="arrow_${k}" class="arrow-svg hidden-step" style="left: ${arrowLeft}px; top: ${arrowTop}px; height: ${arrowH}px;" viewBox="0 0 24 ${arrowH}">
                      <path d="${pathD}" fill="#aed581" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
                     </svg>`;

            stepMap.push({ in: subIds, out: [`arrow_${k}`, ...bringIds], type: 'sub', mStep: k });
            stepMap.push({ in: bringIds, out: [`q_${k+1}`], type: 'bring', mStep: k });
        } else {
            let remStr = s.rem.toString(), remIds = [];
            for(let j=0; j<remStr.length; j++) {
                let rId = `rem_${j}`; remIds.push(rId);
                html += `<input type="text" id="${rId}" class="box user-input hidden-step" style="left: ${200 + (s.digitIndex - (remStr.length - 1 - j))*70}px; top: ${310 + k*170}px;" readonly>`;
                correctKeys[rId] = remStr[j];
            }
            stepMap.push({ in: subIds, out: remIds, type: 'sub', mStep: k });
            stepMap.push({ in: remIds, out: [], type: 'rem', mStep: k });
        }
    }

    let board = document.getElementById('app-container'); board.innerHTML = html;
    board.style.height = (310 + (mathSteps.length - 1) * 170 + 100) + 'px';
    currentStep = 0; activeId = null; isSelectionPhase = true; userSelectedDigitIndex = -1; initialDigitIndex = mathSteps[0].digitIndex; 
    attachEvents();
  }

  function startAuto() {
    let level = document.getElementById('difficulty-level').value;
    let d = Math.floor(Math.random() * 8) + 2; let q, r, dividend;
    if (level === '1') { let maxQ = Math.floor(999/d), minQ = Math.ceil(100/d); q = Math.floor(Math.random() * (maxQ - minQ + 1)) + minQ; dividend = d * q; } 
    else if (level === '2') { let maxQ = Math.floor(999/d), minQ = Math.ceil(100/d); q = Math.floor(Math.random() * (maxQ - minQ + 1)) + minQ; r = Math.floor(Math.random() * (d - 1)) + 1; dividend = d * q + r; if(dividend > 999) dividend -= d; } 
    else if (level === '3') { let validQs = []; for (let X = 1; X <= 9; X++) { for (let Y = 1; Y <= 9; Y++) { let val = X * 100 + Y; if (val * d >= 100 && val * d <= 999) validQs.push(val); } } q = validQs.length > 0 ? validQs[Math.floor(Math.random() * validQs.length)] : 101; dividend = d * q; }
    setupEngine(d, dividend); updateMsg("Klik 1 digit atau 2 digit awal yang mau dibagi, lalu Periksa Jawaban!", "#000");
  }

  function startManual() {
    let div = parseInt(document.getElementById('manual-divisor').value); let dnd = parseInt(document.getElementById('manual-dividend').value);
    if(isNaN(div) || isNaN(dnd)) return alert("Isi angka dulu!"); if(dnd < 100 || dnd > 999) return alert("Angka yang dibagi harus 3 digit!");
    setupEngine(div, dnd); updateMsg("Klik 1 digit atau 2 digit awal yang mau dibagi, lalu Periksa Jawaban!", "#000");
  }

  function checkStep() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if(isSelectionPhase) {
        if(userSelectedDigitIndex === -1) { playSound('wrong'); updateMsg("Klik dulu angka yang mau dibagi di dalam kotak!", "var(--error)"); return; }
        if (userSelectedDigitIndex === initialDigitIndex) {
            playSound('correct'); isSelectionPhase = false; 
            let firstQBox = document.getElementById('q_0'); firstQBox.classList.remove('hidden-step'); firstQBox.classList.add('fade-in');
            setActive('q_0'); updateMsg("TEPAT SEKALI! Sekarang ketik hasil baginya di atas.", "var(--success)");
        } else {
            playSound('wrong'); let val = parseInt(currentDividend.toString().substring(0, userSelectedDigitIndex + 1));
            let digEl = document.getElementById(`div_digit_${userSelectedDigitIndex}`);
            digEl.classList.add('shake'); setTimeout(() => digEl.classList.remove('shake'), 400);
            if (val < currentDivisor) updateMsg(`UPS! ${val} lebih kecil dari ${currentDivisor}. Coba klik angka sebelahnya agar jadi 2 digit!`, "var(--error)");
            else updateMsg(`TUNGGU! Angka ${val} sudah bisa dibagi ${currentDivisor}. Cukup pilih 1 digit awal saja!`, "var(--error)");
        } return; 
    }
    
    if(!stepMap[currentStep]) return;
    let stage = stepMap[currentStep], ok = true, anyEmpty = false;
    stage.in.forEach(id => {
      let el = document.getElementById(id); el.classList.remove('shake'); 
      if(el.value === '') { anyEmpty = true; ok = false; } 
      else if(el.value === correctKeys[id]) { el.classList.add('correct'); el.classList.remove('wrong', 'active-input'); } 
      else { el.classList.add('wrong'); void el.offsetWidth; el.classList.add('shake'); ok = false; }
    });

    if(ok) {
      playSound('correct');
      if(stage.out.length > 0) {
        stage.out.forEach(id => { let el = document.getElementById(id); el.classList.remove('hidden-step'); el.classList.add('fade-in'); });
        currentStep++; setActive(stepMap[currentStep].in[0]); updateMsg("BAGUS! Lanjutkan langkah berikutnya.", "var(--success)");
      } else {
        let finalQuotient = mathSteps.map(m => m.qDigit).join(''); let finalRemainder = mathSteps[mathSteps.length - 1].rem;
        let resultText = `🎉 HEBAT! ${currentDividend} : ${currentDivisor} = ${finalQuotient}`;
        if(finalRemainder > 0) resultText += ` Sisa ${finalRemainder}`;
        playSound('win'); triggerConfetti(); updateMsg(resultText, "var(--success)"); setActive(null);
      }
    } else { playSound('wrong'); updateMsg(anyEmpty ? "Isi kotak biru yang kosong!" : "UPS, ada yang salah. Cek kotak merah!", "var(--error)"); }
  }

  function getHint() {
    if(isSelectionPhase) {
        let firstDigit = parseInt(currentDividend.toString()[0]);
        if (firstDigit < currentDivisor) updateMsg(`💡 Karena ${firstDigit} lebih kecil dari ${currentDivisor}, kamu harus ambil 2 angka! Klik angka ke-2.`, "#8e24aa");
        else updateMsg(`💡 Karena ${firstDigit} sudah bisa dibagi ${currentDivisor}, cukup klik angka pertama saja!`, "#8e24aa");
        return;
    }
    if(!stepMap[currentStep]) return; let s = mathSteps[stepMap[currentStep].mStep], m = ""; 
    if(stepMap[currentStep].type === 'q') m = `${s.currentVal} : ${currentDivisor}?`;
    else if(stepMap[currentStep].type === 'sub') m = `${s.qDigit} x ${currentDivisor}?`;
    else m = "Kurangi angkanya dan ketik hasilnya.";
    updateMsg("💡 Petunjuk: " + m, "#8e24aa");
  }

  function updateMsg(t, c) { let b = document.getElementById('msg'); b.innerText = t; b.style.color = c; }
  window.onload = startAuto;
</script>
